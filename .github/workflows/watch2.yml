name: watch2

# МАССОВО-ПАРАЛЛЕЛЬНЫЙ просмотр видео на бесплатных раннерах GitHub.
# Публичный репозиторий → минуты не ограничены, Free-план → 20 одновременных job'ов.
# Одна и та же работа раскидывается на N шардов, поэтому 40-минутное видео считается
# за время одного шарда, а не за суммарное.
#
# Никаких Hugging Face и API-ключей: Whisper — с CDN OpenAI, VLM — из реестра Ollama.

on:
  workflow_dispatch:
    inputs:
      asset_tag: { description: "release tag с ассетами", required: true }
      run_dir:   { description: "каталог прогона (results/<run_dir>)", required: true }
      jobs_json:
        description: "матрица задач: [{\"mode\":\"whisper\",\"shard\":0,\"of\":4,\"model\":\"large-v3\"}, ...]"
        required: true
      whisper_model: { description: "для merge/отчётности", default: "large-v3" }
      caption_model: { description: "для merge/отчётности", default: "qwen3-vl:2b" }

permissions:
  contents: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs_json) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip
          pip install -q faster-whisper
      - name: work
        env:
          RUN_DIR: ${{ inputs.run_dir }}
        run: |
          python scripts/shard_worker.py "${{ matrix.mode }}" \
            --shard ${{ matrix.shard }} --of ${{ matrix.of }} \
            --tag "${{ inputs.asset_tag }}" --model "${{ matrix.model }}" \
            ${{ matrix.lang && format('--lang {0}', matrix.lang) || '' }}
      - name: commit shard result
        run: |
          git config user.name  "video-eye[bot]"
          git config user.email "video-eye@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin main || true
            git add -f results/${{ inputs.run_dir }}/shards || true
            git commit -m "shard ${{ matrix.mode }}-${{ matrix.shard }} [${{ github.run_id }}]" || true
            if git push -q origin HEAD:main; then echo "pushed"; break; fi
            echo "конфликт, повтор $i"; sleep 5
          done
      - name: upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.mode }}-${{ matrix.shard }}
          path: results/${{ inputs.run_dir }}/shards/
          if-no-files-found: warn
          retention-days: 14

  merge:
    needs: work
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: свежий checkout (шарды могли запушиться после старта)
        run: |
          git fetch -q origin main
          git reset --hard -q origin/main
          ls results/${{ inputs.run_dir }}/shards || true
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q librosa numpy soundfile
      - name: доcкачать ассеты прогона
        run: |
          mkdir -p results/${{ inputs.run_dir }}/assets
          for f in meta.json audio.opus; do
            curl -sL "https://github.com/${{ github.repository }}/releases/download/${{ inputs.asset_tag }}/$f" \
              -o "results/${{ inputs.run_dir }}/assets/$f" || true
          done
          ls -la results/${{ inputs.run_dir }}/assets
      - name: merge
        env:
          RUN_DIR: ${{ inputs.run_dir }}
          AUDIO_PATH: results/${{ inputs.run_dir }}/assets/audio.opus
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          CAPTION_MODEL: ${{ inputs.caption_model }}
        run: python scripts/merge_worker.py
      - name: commit report
        run: |
          git config user.name  "video-eye[bot]"
          git config user.email "video-eye@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin main || true
            git add -f results/${{ inputs.run_dir }} || true
            git commit -m "report ${{ inputs.run_dir }} [${{ github.run_id }}]" || true
            if git push -q origin HEAD:main; then echo "pushed"; break; fi
            echo "конфликт, повтор $i"; sleep 5
          done
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: results/${{ inputs.run_dir }}/
          retention-days: 30
