name: watch

# Free & unlimited compute: public repo -> unlimited GitHub-hosted runner minutes (4 vCPU, 16 GB RAM).
# No API keys, no paid services, no Hugging Face:
#   - Whisper weights  -> OpenAI CDN (openaipublic.azureedge.net)
#   - VLM for captions -> Ollama registry (registry.ollama.ai)
#
# The sandbox downloads the video (YouTube blocks datacenter IPs) and uploads
# audio/frames/meta as release assets; this workflow does Whisper + VLM captions.

on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: "release tag holding audio/frames.zip/meta.json (asset mode)"
        default: ""
      url:
        description: "or a direct media URL the runner can fetch itself (mp4/mkv/webm)"
        default: ""
      whisper_model:
        description: "tiny|base|small|medium|large-v3|off"
        default: "small"
      caption:
        description: "off | moondream | qwen2.5vl:3b | llava:7b"
        default: "off"
      frames:
        description: "frames to sample in direct mode"
        default: "60"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q yt-dlp
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q openai-whisper

      - name: Watch (whisper + VLM captions)
        env:
          ASSET_TAG: ${{ inputs.asset_tag }}
          VID_URL: ${{ inputs.url }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          CAPTION_MODE: ${{ inputs.caption }}
          VID_FRAMES: ${{ inputs.frames }}
          RUN_LABEL: ${{ github.run_id }}
        run: python scripts/watch_job.py

      - name: Commit report back to the repo
        if: always()
        run: |
          git config user.name  "video-eye[bot]"
          git config user.email "video-eye@users.noreply.github.com"
          git add -f results 2>/dev/null || true
          git commit -m "watch ${{ github.run_id }}" || echo "nothing to commit"
          git push || echo "push skipped"
